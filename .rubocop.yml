# Keep compatible with the oldest supported Redmine (5.0: Ruby 2.5, Rails 6.1).
plugins:
  - rubocop-rails
  - rubocop-performance

AllCops:
  TargetRubyVersion: 2.5
  TargetRailsVersion: 6.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
Metrics/MethodLength:
  Max: 25
  Exclude:
    - 'test/**/*'

# Trailing comments on the sniffer's pattern lists are column-aligned.
Layout/ExtraSpacing:
  Exclude:
    - 'lib/textile_transparent/textile_sniffer.rb'
